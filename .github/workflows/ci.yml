name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Reference implementation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - run: pip install -e ".[dev]"

      # The chapters quote numbers produced by this package running on the
      # Kestrel corpus with the mock LLM. If the tests break, those numbers are
      # suspect too.
      - name: Test
        run: pytest -q

  site:
    name: Site structure, links and asset stamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every chapter in curriculum.js exists, has its required components,
      # valid visualization JSON, one correct answer per quiz, and no broken
      # internal links.
      - name: Check site
        run: python3 tools/check_site.py

      # Pages link CSS/JS with ?v=<content hash> so browsers never mix stale and
      # fresh assets. If someone edits site/assets without re-stamping, the
      # stamps below change and this step fails with the diff.
      - name: Asset stamps are current
        run: |
          python3 tools/stamp_assets.py
          git diff --exit-code -- site

  render:
    name: Render every page in Chromium
    runs-on: ubuntu-latest
    needs: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # Loads all pages at desktop and phone widths in light and dark, steps
      # through every visualization, and fails on console errors, pages whose
      # figures did not mount, or horizontal overflow.
      - name: Render check
        run: |
          python3 tools/serve.py 8765 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 0.5; done
          python3 tools/render_check.py | tee render.log
          grep -q "pages with problems: 0" render.log
