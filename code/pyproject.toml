[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minigraphrag"
version = "0.1.0"
description = "A small, readable GraphRAG implementation built from scratch for teaching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.40"]
leiden = ["graspologic>=3.3"]
st = ["sentence-transformers>=2.7"]
neo4j = ["neo4j>=5.0"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=7"]

[project.scripts]
minigraphrag = "minigraphrag.cli:main"

[tool.setuptools.packages.find]
include = ["minigraphrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
